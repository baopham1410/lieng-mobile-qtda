providers = ['php']

[variables]
NIXPACKS_PHP_ROOT_DIR = "/public"

[phases.setup]
nixPkgs = [
  'php82',
  'php82Packages.composer',
  'php82Extensions.pdo_pgsql',
  'php82Extensions.pgsql',
  'php82Extensions.bcmath',
  'php82Extensions.mbstring',
  'php82Extensions.tokenizer',
  'php82Extensions.xml',
  'php82Extensions.ctype',
  'php82Extensions.json'
]

[phases.install]
cmds = [
  'composer install --ignore-platform-reqs --no-dev --optimize-autoloader --no-interaction'
]

[start]
cmd = 'php artisan config:clear && php artisan serve --host=0.0.0.0 --port=$PORT'
